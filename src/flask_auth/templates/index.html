{% extends "base.html" %}
{% block content %}
<h1>Authentication Flask App</h1>
{% if not logged_in %}
  <p><a href="{{ url_for('main.login') }}">Login</a> or <a href="{{ url_for('main.register') }}">Register</a></p>
{% else %}
  <p>(you are already logged in) <a href="{{ url_for('main.secrets') }}">Secrets</a></p>
{% endif %}
{% endblock %}
