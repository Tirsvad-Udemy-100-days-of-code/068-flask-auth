{% extends "base.html" %}
{% block content %}
<div class="page-column">
  <h1 class="page-title">Flask Authentication</h1>
  {% if not logged_in %}
    <a class="btn btn-lecture-primary mb-3" href="{{ url_for('main.login') }}">Login</a>
    <a class="btn btn-lecture-secondary" href="{{ url_for('main.register') }}">Register</a>
  {% else %}
    <p class="page-text">(you are already logged in)</p>
    <a class="btn btn-lecture-primary" href="{{ url_for('main.secrets') }}">Secrets</a>
  {% endif %}
</div>
{% endblock %}
