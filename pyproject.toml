[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-auth-day-68"
version = "0.1.0"
description = "Udemy 100 Days of Code, Day 68: Flask authentication app with README and wiki."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.1.8",
    "Werkzeug==3.1.9",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.package-data]
flask_auth = ["presentation/templates/*.html", "presentation/static/files/*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

# flask_login 0.6.3 ships no type information (no py.typed, no stubs), so its
# import is untyped. This override covers the import only.
[[tool.mypy.overrides]]
module = ["flask_login", "flask_login.*"]
ignore_missing_imports = true

# Because flask_login is untyped, UserMixin, login_required and user_loader are
# Any. Strict mode rejects subclassing Any and decorating with an untyped
# decorator; relax those two checks for the two presentation modules that use
# Flask-Login, and nowhere else.
[[tool.mypy.overrides]]
module = [
    "flask_auth.presentation.login_adapter",
    "flask_auth.presentation.routes",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false
